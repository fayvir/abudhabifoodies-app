<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--tangerine:#FF6200;--ink:#15161A;--cream:#FFF4EA}
*{margin:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden}
body{font-family:Inter,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;position:relative}
body.t{background:var(--tangerine);color:var(--ink)}
body.k{background:var(--ink);color:#fff}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.09) 1.6px,transparent 1.7px);background-size:22px 22px;pointer-events:none}
body.k .dots{background-image:radial-gradient(rgba(255,255,255,.07) 1.6px,transparent 1.7px)}
.head{position:relative;text-align:center;padding:8.5vh 7vw 0;height:31vh}
h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:11.4vw;line-height:.98;letter-spacing:-.035em}
h1 em{font-style:normal;display:inline-block;background:var(--ink);color:var(--tangerine);padding:0 .14em .06em;border-radius:.18em;transform:rotate(-2deg);margin-top:.08em}
body.k h1 em{background:var(--tangerine);color:var(--ink)}
p{margin-top:2.2vh;font-size:4.3vw;font-weight:600;line-height:1.3;opacity:.85}
.phone{position:relative;margin-top:1.5vh;width:78vw;flex:none;background:#0B0B0D;border-radius:13vw;padding:2.6vw;box-shadow:2.6vw 2.6vw 0 var(--ink)}
body.k .phone{box-shadow:2.6vw 2.6vw 0 var(--tangerine);outline:.5vw solid #3A3F4A}
body.t .phone{outline:.7vw solid var(--ink)}
.screen{border-radius:10.6vw;overflow:hidden;background:#fff;position:relative}
.sb{height:12.5vw;display:flex;align-items:center;justify-content:space-between;padding:1.8vw 6vw 0 10vw;font:600 4vw/1 -apple-system,Inter,sans-serif;color:#000}
.island{position:absolute;top:2.6vw;left:50%;transform:translateX(-50%);width:21vw;height:6.6vw;border-radius:4vw;background:#000}
.icons{display:flex;gap:1.2vw;align-items:center}.icons svg{height:2.9vw;width:auto}
.screen img{display:block;width:100%}
</style></head><body>
<div class="dots"></div>
<div class="head"><h1 id="h"></h1><p id="p"></p></div>
<div class="phone"><div class="screen"><div class="island"></div>
<div class="sb"><span>9:41</span><span class="icons">
<svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
<svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.2c2.4 0 4.6.9 6.2 2.5l1.2-1.2C13.4 1.5 10.8.4 8 .4S2.6 1.5.6 3.5l1.2 1.2C3.4 3.1 5.6 2.2 8 2.2zm0 3.5c1.4 0 2.7.5 3.7 1.5l1.2-1.2C11.6 4.7 9.9 4 8 4s-3.6.7-4.9 2l1.2 1.2c1-1 2.3-1.5 3.7-1.5zM8 9.2l-2.2 2.2L8 13.6l2.2-2.2z"/></svg>
<svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.4-1.1 1.4-2s-.6-1.7-1.4-2z" opacity=".4"/></svg>
</span></div>
<img id="img"></div></div>
<script>
const q=new URLSearchParams(location.search);
document.body.className=q.get('bg');
document.getElementById('h').innerHTML=q.get('h');
document.getElementById('p').textContent=q.get('p');
document.getElementById('img').src=q.get('img');
</script></body></html>
