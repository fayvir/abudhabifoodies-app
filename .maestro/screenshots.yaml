# App Store screenshots: drives the real app (live API) through one search and
# captures each screen. Run by .github/workflows/ios-screenshots.yml.
appId: ae.abudhabifoodies.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "What are you in the mood for?"
    timeout: 60000
# The splash covers the (already rendered) first question until the guide is ready.
- extendedWaitUntil:
    notVisible:
      id: "brand-splash"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Italian"
- extendedWaitUntil:
    visible: "What's your budget per person?"
    timeout: 30000
- tapOn: "Mid"
- extendedWaitUntil:
    visible: "Date Night"
    timeout: 30000
- takeScreenshot: screenshots/raw-questions

- tapOn: "Date Night"
- extendedWaitUntil:
    visible: "Here's what we'd recommend:"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
# Give the restaurant photo time to download before the shot.
- extendedWaitUntil:
    visible:
      id: "result-photo-0"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/raw-result
- tapOn: "Save to favourites"

# A second saved place so the Saved list is not a single card.
- tapOn: "New search"
- extendedWaitUntil:
    visible: "What are you in the mood for?"
    timeout: 30000
- tapOn: "Japanese"
- extendedWaitUntil:
    visible: "What's your budget per person?"
    timeout: 30000
- tapOn: "Mid"
- extendedWaitUntil:
    visible: "Hidden Gem"
    timeout: 30000
- tapOn: "Hidden Gem"
- extendedWaitUntil:
    visible: "Here's what we'd recommend:"
    timeout: 30000
- tapOn: "Save to favourites"

- tapOn:
    id: "tab-saved"
- extendedWaitUntil:
    visible: "Want To Try"
    timeout: 30000
# Saved cards show the restaurant's photos; give them time to download.
- extendedWaitUntil:
    visible:
      id: "result-photo-0"
    timeout: 15000
    optional: true
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: screenshots/raw-saved
