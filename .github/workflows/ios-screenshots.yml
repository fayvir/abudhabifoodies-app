name: iOS screenshots

# App Store screenshots from the real app on a 6.9" iPhone simulator, plus the
# same shots at 1206x2622 for App Store Connect's iPhone "medium display"
# (6.1"/6.3") slot, which is the one it asked for on the first submission.
# No signing, no secrets, no upload: the PNGs come back as a run artifact.
# Manual only (Actions > iOS screenshots > Run workflow): each run is ~30 macOS
# minutes, which bill at about 10x Linux minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean

      # Release so the JS bundle is embedded (no Metro server on the runner).
      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -workspace ios/AbuDhabiFoodies.xcworkspace -scheme AbuDhabiFoodies \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 40

      - name: Boot a 6.9-inch iPhone with a clean status bar
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available | grep -E 'iPhone 1[6-9] Pro Max' | head -n 1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE" ]; then echo "No Pro Max simulator on this runner"; exit 1; fi
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance light
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" build/Build/Products/Release-iphonesimulator/AbuDhabiFoodies.app

      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Take the screenshots
        env:
          # The XCTest driver can take over the 2-minute default to start on a busy runner.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '240000'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          set -o pipefail   # maestro's exit status must survive the pipe into tee
          mkdir -p screenshots
          # Warm-up: the first app launch after boot is slow, and Maestro's XCTest
          # driver sometimes never starts on a cold simulator (seen twice; the run
          # where it worked had the driver up in 30 s). One retry after a simulator
          # restart covers that; a failing flow step still fails the job.
          xcrun simctl launch "$DEVICE" ae.abudhabifoodies.app || true
          sleep 20
          xcrun simctl terminate "$DEVICE" ae.abudhabifoodies.app || true
          for attempt in 1 2; do
            if maestro --device "$DEVICE" test .maestro/screenshots.yaml 2>&1 | tee "maestro-$attempt.log"; then break; fi
            if [ "$attempt" = 2 ] || ! grep -q "iOS driver not ready in time" "maestro-$attempt.log"; then exit 1; fi
            echo "Driver did not start; restarting the simulator and trying once more"
            xcrun simctl shutdown "$DEVICE" || true
            xcrun simctl boot "$DEVICE"
            xcrun simctl bootstatus "$DEVICE" -b
            xcrun simctl status_bar "$DEVICE" override --time "9:41" --dataNetwork wifi --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          done
          ls -la screenshots
          sips -g pixelWidth -g pixelHeight screenshots/*.png || true

      # App Store Connect asks for the iPhone "medium display" slot (6.1"/6.3",
      # 1206x2622), not only 6.9". Same shots, scaled to the height and trimmed
      # one pixel of width, so nothing is stretched (1320x2868 -> 1207x2622 -> 1206x2622).
      - name: Collect both App Store sizes
        run: |
          mkdir -p app-store/6.9in app-store/6.3in
          find ~/.maestro/tests screenshots -name '0*.png' -exec cp {} app-store/6.9in/ \;
          ls app-store/6.9in/*.png >/dev/null   # fail if Maestro produced nothing
          for f in app-store/6.9in/*.png; do
            out="app-store/6.3in/$(basename "$f")"
            sips --resampleHeight 2622 "$f" --out "$out" >/dev/null
            sips --cropToHeightWidth 2622 1206 "$out" >/dev/null
          done
          sips -g pixelWidth -g pixelHeight app-store/*/*.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-store-screenshots
          path: |
            app-store/
            ~/.maestro/tests/
          if-no-files-found: warn
