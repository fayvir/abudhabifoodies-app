name: iOS

# Builds the Expo app on a macOS runner and, on request, signs it with
# an App Store Connect API key and uploads it to TestFlight. Nothing runs on
# push/PR on purpose: macOS minutes cost about 10x Linux minutes on private repos.
# Setup: the App Store Connect API key secrets listed in README.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: compile-only needs no secrets; testflight signs and uploads
        type: choice
        options: [compile-only, testflight]
        default: compile-only
  push:
    tags: ['ios-v*']

permissions:
  contents: read

concurrency:
  group: ios
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      WORKSPACE: ios/AbuDhabiFoodies.xcworkspace   # generated by expo prebuild (ios/ is gitignored)
      SCHEME: AbuDhabiFoodies
      SIGNING: ${{ github.event_name == 'push' || inputs.mode == 'testflight' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: ls -d /Applications/Xcode*.app   # what the runner image offers, for the log
      # From April 2027 Apple only accepts uploads built with the iOS 27 SDK (Xcode 27).
      # latest-stable picks Xcode 27 as soon as GitHub adds it to the runner; on
      # 2026-11-18 the newest there was 26.6, and no macos-27 image existed.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci

      # Generates ios/ from app.json (bundle id, icon, plugins) and runs pod install.
      - name: Generate the Xcode project
        run: npx expo prebuild --platform ios --clean

      # Expo writes CFBundleVersion / CFBundleShortVersionString as fixed values, so
      # xcodebuild's MARKETING_VERSION / CURRENT_PROJECT_VERSION overrides would be
      # ignored and the second upload would be rejected as a duplicate build number.
      # Patch the plist instead. Build number = <run number + 100>.<attempt>: it always
      # increases, and a "Re-run" of an already-uploaded run (same run number) still
      # gets a new number instead of being rejected as a duplicate.
      - name: Set version and build number
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#ios-v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$VERSION' is not 1, 1.2 or 1.2.3 (tags must look like ios-v1.2.3); App Store Connect would reject it"
            exit 1
          fi
          # +100: this repo's run numbers restart at 1, and builds up to 7.1 were already
          # uploaded from the private repo; App Store Connect rejects a reused build number.
          BUILD="$((GITHUB_RUN_NUMBER + 100)).${GITHUB_RUN_ATTEMPT}"
          PLIST="ios/AbuDhabiFoodies/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          echo "Version $VERSION (build $BUILD)"

      - run: xcodebuild -list -workspace "$WORKSPACE"   # shows the schemes in the log

      - name: Compile only, unsigned
        if: env.SIGNING != 'true'
        run: |
          xcodebuild build -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

      # The archive is unsigned on purpose: a signed archive uses a *development*
      # profile, which needs a registered device (a new account has none). The export
      # step below signs with Apple's cloud-managed distribution certificate instead.
      - name: Archive (unsigned on purpose)
        if: env.SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          for n in KEY_ID ISSUER_ID KEY_P8 TEAM_ID; do
            [ -n "${!n}" ] || { echo "::error::Missing secret $n"; exit 1; }
          done
          printf '%s' "$KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild archive -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign and upload to TestFlight
        if: env.SIGNING == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Remove the key
        if: always() && env.SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
