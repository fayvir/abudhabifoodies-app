name: Android

# Builds the Expo app into an Android App Bundle (.aab) on a Linux runner.
# - Pull requests that touch the native setup: unsigned compile check (no secrets).
# - Run workflow > signed: signs with the upload key and saves the .aab as a run
#   artifact. Upload it in Play Console by hand (Google requires the first
#   upload of a new app to be manual).
# Setup: the upload-key secrets listed in README.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: compile-only needs no secrets; signed builds a .aab for Play
        type: choice
        options: [compile-only, signed]
        default: compile-only
  push:
    tags: ['android-v*']
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - app.json
      - assets/**
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  # Only PR checks are superseded by a newer push; a signed build is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SIGNING: ${{ github.event_name == 'push' || inputs.mode == 'signed' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci

      # versionCode = run number * 100 + attempt: always increases, and a "Re-run"
      # still gets a new number (Play rejects a reused versionCode).
      - name: Set version and versionCode
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#android-v}"; fi
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "::error::Version '$VERSION' is not 1, 1.2 or 1.2.3 (tags must look like android-v1.2.3)"
            exit 1
          fi
          CODE="$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))"
          node -e "
            const fs = require('fs');
            const j = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            j.expo.version = process.argv[1];
            j.expo.android.versionCode = Number(process.argv[2]);
            fs.writeFileSync('app.json', JSON.stringify(j, null, 2));
          " "$VERSION" "$CODE"
          echo "Version $VERSION (versionCode $CODE)"

      # Generates android/ from app.json (package, icon, plugins). android/ is gitignored.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Compile only (debug-signed, not for upload)
        if: env.SIGNING != 'true'
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      # The generated project signs release builds with the debug key; the injected
      # properties override that with the upload key.
      - name: Build and sign with the upload key
        if: env.SIGNING == 'true'
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for n in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!n}" ] || { echo "::error::Missing secret $n"; exit 1; }
          done
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      # Fails the run if the bundle still carries the debug certificate, so a
      # debug-signed .aab can never be mistaken for an uploadable one.
      - name: Check the signature
        if: env.SIGNING == 'true'
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          CERT="$(keytool -printcert -jarfile "$AAB")"
          echo "$CERT" | grep -E 'Owner:|SHA256:'
          if echo "$CERT" | grep -q 'CN=Android Debug'; then
            echo "::error::Bundle is signed with the debug key"; exit 1
          fi

      - name: Save the .aab
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: abudhabifoodies-android-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Remove the key
        if: always() && env.SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/upload.jks"
